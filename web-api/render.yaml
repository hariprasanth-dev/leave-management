# Render Blueprint — gateway + optional full stack via web-api/Dockerfile
services:
  - type: web
    name: leave-management-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://leave-management-six-ruby.vercel.app
      - key: DATABASE_URL
        sync: false
