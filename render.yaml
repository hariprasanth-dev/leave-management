# Blueprint: apply in Render Dashboard → New → Blueprint
services:
  - type: web
    name: leave-management-api
    runtime: python
    rootDir: web-api
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn gateway.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/version
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://leave-management-six-ruby.vercel.app
      - key: DATABASE_URL
        sync: false
